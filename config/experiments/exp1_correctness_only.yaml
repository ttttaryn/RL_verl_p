# GRPO Experiment 1: Correctness Only

defaults:
  - grpo_gsm8k

trainer:
  experiment_name: gsm8k_grpo_exp1_correctness_only

reward_mode: legacy_reasoning
warmup_use_legacy_reward: true

custom_reward_function:
  name: compute_score
  reward_kwargs:
    w_correctness: 1.0
    w_format: 0.0
    w_reasoning: 0.0
    correctness_method: "flexible"
    answer_conditioned_reasoning: false
    continuous_format_reward: true
