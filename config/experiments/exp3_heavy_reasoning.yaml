# GRPO Experiment 3: Heavy Reasoning Weight

defaults:
  - grpo_gsm8k

trainer:
  experiment_name: gsm8k_grpo_exp3_heavy_reasoning

reward_mode: legacy_reasoning
warmup_use_legacy_reward: true

custom_reward_function:
  name: compute_score
  reward_kwargs:
    w_correctness: 0.5
    w_format: 0.1
    w_reasoning: 0.4
    correctness_method: "flexible"
    answer_conditioned_reasoning: false
    continuous_format_reward: true
    optimal_reasoning_steps: 5
    max_reasoning_steps: 15
