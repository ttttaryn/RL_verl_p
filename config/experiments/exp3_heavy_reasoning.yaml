# Experiment 3: Heavy Reasoning Weight
#
# Uses multi-reward system with emphasis on reasoning:
# - correctness: 0.5
# - format: 0.1
# - reasoning: 0.4

defaults:
  - ppo_gsm8k

trainer:
  experiment_name: gsm8k_exp3_heavy_reasoning

custom_reward_function:
  name: compute_score
  reward_kwargs:
    w_correctness: 0.5
    w_format: 0.1
    w_reasoning: 0.4
    # Encourage more reasoning steps
    optimal_reasoning_steps: 5
    max_reasoning_steps: 15
