# Experiment 2: Multi-Reward with Default Weights
#
# Uses multi-reward system with default weights:
# - correctness: 0.7
# - format: 0.1
# - reasoning: 0.2

defaults:
  - ppo_gsm8k

trainer:
  experiment_name: gsm8k_exp2_multi_reward_default

custom_reward_function:
  name: compute_score
  reward_kwargs:
    w_correctness: 0.7
    w_format: 0.1
    w_reasoning: 0.2
    # New defaults (v2): flexible extraction + answer-conditioned reasoning
    correctness_method: "flexible"
    answer_conditioned_reasoning: true
